name: NeuroThesis Python Analysis Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "research_analysis_jobs.id"
        required: true
      analysis_type:
        description: "Analysis type"
        required: false
        default: "advanced_python"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/analysis_requirements.txt

      - name: Install analysis dependencies
        run: python -m pip install -r scripts/analysis_requirements.txt

      - name: Run analysis worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/advanced_analysis_worker.py --job-id "${{ inputs.job_id }}"
